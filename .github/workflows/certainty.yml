name: Planner certainty and site checks
on:
  push:
    branches: [main, arena/f9e705a1-korea5, arena/02f4d067-korea5]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild and validate published site
        run: |
          python3 scripts/build_site.py
          python3 tools/build_extra.py
          python3 scripts/audit_certainty.py
          python3 scripts/check_links.py
          python3 tools/verify_extra.py
          python3 scripts/audit_certainty.py
          node --check extra/assets/extra.js
          node tests/test_calendar_today.js
      - name: NFL lines lab checks (unit tests + link integrity)
        run: |
          python3 -m unittest discover -s nfl/tests -v
          python3 nfl/build_site.py
      - name: Python syntax
        run: python3 -m compileall -q scripts tools nfl
