name: Official feeds and Pages

on:
  # A Pages deployment does not change source branches. A main push publishes
  # the reviewed snapshot; a scheduled run builds a refreshed, checked snapshot.
  push:
    branches: [main, 'arena/25b9e992-korea5']
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-official-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages_enabled: ${{ steps.pages-mode.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source-ingestion regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Decide whether to refresh data
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || \
             { [ "$REF" = refs/heads/arena/25b9e992-korea5 ] && [[ "$MESSAGE" = *"[verify official]"* ]]; }; then
            echo 'refresh=true' >> "$GITHUB_OUTPUT"
          else
            echo 'refresh=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch official NFL, Westwood One and MLB TBD feeds
        if: steps.mode.outputs.refresh == 'true'
        run: |
          if python3 tools/fetch_official.py > /tmp/official-fetch.log 2>&1; then
            cat /tmp/official-fetch.log
            python3 -c 'import json; r=json.load(open("official/fetch-report.json")); print("::notice title=Official source refresh::" + json.dumps({"counts":r["counts"],"warnings":r["warnings"][:5],"warningCount":len(r["warnings"])},ensure_ascii=True).replace("%","%25"))'
          else
            # Preserve useful diagnostics in the check run, without pushing
            # partially fetched data or relying on downloadable log artifacts.
            python3 -c 'import json; from pathlib import Path; s=Path("/tmp/official-fetch.log").read_text(errors="replace"); i=s.rfind("\n{\n  \"generatedUTC\""); r=json.JSONDecoder().raw_decode(s[i+1:])[0] if i>=0 else {"error":s[-2000:]}; f=r.get("failures",[]); r["failureCount"]=len(f); r["failures"]=f[:12]; print("::error title=Official feed refresh failed::" + json.dumps(r,ensure_ascii=True).replace("%","%25"))'
            exit 1
          fi
      - name: Fetch MLB seasons and reject incomplete responses
        if: steps.mode.outputs.refresh == 'true'
        run: |
          cp data/mlb-summary.json /tmp/korea5-mlb-before.json
          python3 scripts/fetch_mlb.py
          python3 -c 'import json,sys; old=json.load(open("/tmp/korea5-mlb-before.json")); new=json.load(open("data/mlb-summary.json")); bad={y:v for y,v in new.items() if v.get("failedWindows") or (old.get(y,{}).get("regularSeasonGames",0)>0 and v.get("regularSeasonGames",0)<old[y]["regularSeasonGames"]*0.95)}; print("Incomplete or unexpectedly smaller MLB feeds:",bad); sys.exit(bool(bad))'
      - name: Rebuild from the checked snapshot
        if: steps.mode.outputs.refresh == 'true'
        run: |
          cp official/nfl-2026.json data/upstream/nfl-2026.json
          cp official/w1-stations.json data/upstream/w1-stations.json
          python3 scripts/build_events.py
          python3 scripts/analyze.py
          python3 scripts/build_site.py
          python3 tools/build_extra.py
      - name: Validate site and local links
        run: |
          python3 scripts/audit_certainty.py
          python3 scripts/check_links.py
          python3 tools/verify_extra.py
          python3 scripts/audit_certainty.py
      - name: Preserve source-refresh diagnostics for branch testing
        if: github.ref != 'refs/heads/main' && steps.mode.outputs.refresh == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: official-feed-test-${{ github.run_id }}
          path: |
            official/
            data/mlb-summary.json
          retention-days: 7
      - name: Detect Pages publishing mode
        id: pages-mode
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = refs/heads/main ]; then
            type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
            if [ "$type" = workflow ]; then
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
            else
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              echo '::warning::Pages is still using branch publishing; refreshed data has not been deployed by this workflow.'
            fi
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload checked site to Pages
        if: github.ref == 'refs/heads/main' && steps.pages-mode.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked site
        id: deployment
        uses: actions/deploy-pages@v4
