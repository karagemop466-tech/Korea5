name: live-verify-0f530dc5
on:
  workflow_dispatch:
  push:
    branches: [ 'arena/0f530dc5-korea5' ]
    paths:
      - 'scripts/**'
      - 'tools/**'
      - 'data/curated/**'
      - 'curated/**'
      - '.github/workflows/live-verify-0f530dc5.yml'
permissions:
  contents: write
concurrency:
  group: live-verify-0f530dc5
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Live pull of every official feed
        run: |
          mkdir -p official-live
          python3 scripts/fetch_mlb.py --years 2026 2027 2028 2029 --out-dir official-live
          KOREA5_OFFICIAL_OUT=official-live python3 tools/fetch_official.py
      - name: Compare the live pull with the committed feeds
        run: python3 scripts/compare_feeds.py --live official-live
      - name: Refresh the committed feeds from the live pull (never deletes committed data)
        run: python3 scripts/merge_live_feeds.py --live official-live
      - name: Rebuild the event feed and the free/busy analysis
        run: |
          python3 scripts/build_events.py
          python3 scripts/analyze.py
      - name: Re-check every curated row against its live official page
        run: python3 scripts/verify.py
      - name: Commit the refreshed feeds and the verification evidence
        run: |
          git config user.name "korea5-data-bot"
          git config user.email "korea5-data-bot@users.noreply.github.com"
          git add verification/ data/ official/
          git commit -m "data+verification: refresh official feeds from the live pull and re-verify" || echo "no changes"
          git pull --rebase --autostash origin arena/0f530dc5-korea5
          git push origin HEAD:arena/0f530dc5-korea5
