name: nfl-data

# Fetch official NFL results / injuries / depth charts / team+player stats / rosters.
on:
  workflow_dispatch:
  push:
    branches: [ 'arena/998582f0-korea5' ]
    paths: [ 'nfl/tools/fetch_official.py', '.github/workflows/nfl-data.yml' ]
permissions:
  contents: write
concurrency:
  group: nfl-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/998582f0-korea5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch official NFL data
        run: python3 nfl/tools/fetch_official.py
      - name: Commit official data
        run: |
          git config user.name "korea5-nfl-bot"
          git config user.email "korea5-nfl-bot@users.noreply.github.com"
          git add -A nfl/data/
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "nfl: refresh official results/injuries/depth/stats"
            git pull --rebase --autostash origin arena/998582f0-korea5
            git push origin HEAD:arena/998582f0-korea5
          fi
