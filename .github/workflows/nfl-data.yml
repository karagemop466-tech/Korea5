name: nfl-lines-data
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe | full"
        default: "probe"
  push:
    branches: [ 'arena/02f4d067-korea5' ]
    paths:
      - 'nfl/fetch_data.py'
      - '.github/workflows/nfl-data.yml'
permissions:
  contents: write
concurrency:
  group: nfl-lines-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/02f4d067-korea5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: python3 -m pip install --quiet pandas pyarrow
      - name: probe (schema snapshot)
        if: github.event.inputs.mode != 'full'
        run: python3 nfl/fetch_data.py --probe --seasons 2024 2025 2026
      - name: full pull
        if: github.event.inputs.mode == 'full'
        run: python3 nfl/fetch_data.py --seasons 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026 --with-espn
      - name: commit derived provenance + schema
        run: |
          git config user.name "korea5-nfl-bot"
          git config user.email "korea5-nfl-bot@users.noreply.github.com"
          git add -f nfl/data/provenance.json nfl/data/schema_probe.json
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "nfl: data provenance + schema snapshot (CI-fetched)"
            git pull --rebase --autostash origin arena/02f4d067-korea5
            git push origin HEAD:arena/02f4d067-korea5
          fi
